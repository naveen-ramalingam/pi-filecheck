[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-filecheck"
dynamic = ["version"]
description = "Read-only file integrity checks for Raspberry Pi and Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Pi FileCheck contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2", "setuptools>=77"]

[project.scripts]
filecheck = "pi_filecheck.cli:main"

[tool.setuptools.dynamic]
version = {attr = "pi_filecheck.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: invokes actual installed utilities", "install: disposable installation test"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]
